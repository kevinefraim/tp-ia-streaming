name: Evaluar audiencia y escenarios sintéticos
on:
  push:
    branches: [viewbotting-experimento]
  workflow_dispatch:

jobs:
  evaluar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Descargar, evaluar y graficar
        run: python experimento_audiencia.py
      - name: Validar métricas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          j=json.loads(Path("resultados/resumen.json").read_text())
          m=pd.read_csv("resultados/metricas.csv")
          assert j["etiquetas_bots_reales"] is False
          assert j["ventanas_test"] > 0 and j["ventanas_train"] > 0
          assert "recall_escenarios_simulados" in m
          assert m["recall_escenarios_simulados"].between(0,1).all()
          for n in ("ejemplo_escenario_simulado.png","comparacion_metodos.png","escenarios_simulados.png"):
              assert (Path("graficos")/n).is_file()
          print(m.to_string(index=False))
          PY
      - name: Publicar solamente resultados derivados y gráficos
        if: github.ref == 'refs/heads/viewbotting-experimento'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/metricas.csv resultados/resumen.json graficos/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Resultados experimentales y gráficos reproducibles"
            git push origin HEAD:viewbotting-experimento
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-viewbotting-experimental
          path: |
            resultados/
            graficos/
