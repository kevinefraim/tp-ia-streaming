name: Verificar y generar resultados
on:
  push:
    paths-ignore:
      - 'graficos/**'
      - 'resultados/**'
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar experimento
        run: python main.py
      - name: Verificar resultados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          data = json.loads(Path("resultados/resumen.json").read_text(encoding="utf-8"))
          metrics = pd.read_csv("resultados/metricas.csv")
          assert data["registros_originales"] == 6192
          assert data["registros_limpios"] == 6191
          assert data["anomalias_etiquetadas"] == 120
          assert data["registros_train"] == 4333
          assert data["registros_test"] == 1858
          assert data["anomalias_test"] == 38
          assert len(metrics) == 3
          assert metrics["f1"].between(0, 1).all()
          for f in ["graficos/comparacion_modelos.png",
                    "graficos/anomalias_por_mes.png",
                    "graficos/trafico_y_anomalias.png"]:
              assert Path(f).exists(), f
          print(metrics.to_string(index=False))
          PY
      - name: Guardar gráficos y métricas en el repositorio
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- graficos/ resultados/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar gráficos y resultados reproducibles"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-y-graficos
          path: |
            resultados/
            graficos/
